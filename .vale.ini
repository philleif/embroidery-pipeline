# Opt out of the ~/LIFE Vale fallback (../.vale.ini).
#
# This repo's markdown is specs, runbooks, and design notes, not prose anyone
# reads for voice. The AI-trope and editorial rules only add noise here.
#
# This lives in a file rather than a glob in ~/LIFE/.vale.ini because Vale
# resolves the nearest .vale.ini by walking the filesystem, which works no matter
# how vale is invoked, whereas a [**/dir/**] glob only matches when the path
# handed to vale contains that directory.
#
# Delete this file to bring the repo under the ~/LIFE fallback.

[*.md]
BasedOnStyles =
