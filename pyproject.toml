[project]
name = "embroidery-pipeline"
version = "0.1.0"
description = "Embroidery digitization, material presets, and stitch-quality auditing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyembroidery>=1.5",
    "lxml>=5",
    "Pillow>=10",
]

[project.optional-dependencies]
trace = ["numpy>=1.26", "scipy>=1.11", "scikit-image>=0.22", "potracer>=0.0.4"]

[project.urls]
Repository = "https://github.com/philleif/embroidery-pipeline"
Issues = "https://github.com/philleif/embroidery-pipeline/issues"

[project.scripts]
stitch = "stitch_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stitch_cli"]

[tool.hatch.build.targets.wheel.force-include]
"materials" = "stitch_cli/data/materials"
"designs/recipes" = "stitch_cli/data/recipes"

[tool.hatch.build.targets.sdist]
only-include = [
    "stitch_cli", "materials", "designs/recipes", "pyproject.toml",
    "README.md", "uv.lock", "docs/RECIPES.md", "docs/DISTRIBUTION.md",
    "docs/QUALITY-BAR.md", "tests/test_distribution.py",
]
