[project]
name = "stitch"
version = "0.1.0"
description = "CLI toolchain for digitizing designs and prepping them for a Brother PE900"
requires-python = ">=3.11"
dependencies = [
    "pyembroidery>=1.5",
    "lxml>=5",
]

[project.scripts]
stitch = "stitch_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stitch_cli"]
